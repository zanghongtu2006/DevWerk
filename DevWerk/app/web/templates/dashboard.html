<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>DevWerk · Multi-agent delivery</title>
  <link rel="stylesheet" href="/web/static/dashboard.css?v=20260826-settings1">
  <script type="module" src="/web/static/dashboard.js?v=20260826-settings1"></script>
</head>
<body data-current-route="overview">
  <div id="loading-bar" class="loading-bar" aria-hidden="true"><i></i><span id="loading-label" class="sr-only"></span></div>
  <div class="app-shell">
    <aside class="global-nav" aria-label="Global navigation">
      <a class="brand" href="/workbench" data-route="overview" aria-label="DevWerk overview">
        <span class="brand-symbol"><i></i><i></i><i></i></span>
        <span><b>DevWerk</b><small>Agentic delivery</small></span>
      </a>
      <nav class="nav-list">
        <a href="/workbench" data-route="overview"><span class="nav-icon">◫</span><span>Overview</span></a>
        <a href="/dashboard" data-route="projects"><span class="nav-icon">⌂</span><span>Projects</span></a>
        <a href="/kanban" data-route="kanban"><span class="nav-icon">▥</span><span>Kanban</span></a>
        <a href="/tasks" data-route="tasks"><span class="nav-icon">✓</span><span>Tasks</span></a>
        <a href="/events" data-route="events"><span class="nav-icon">↻</span><span>Events</span></a>
        <a href="/settings" data-route="settings"><span class="nav-icon">⚙</span><span>Settings</span></a>
      </nav>
      <div class="nav-foot">
        <span class="runtime-avatar">DW</span>
        <span><b>Local Runtime</b><small id="runtime-status" class="runtime-status connecting"><i></i>Connecting</small></span>
      </div>
    </aside>

    <aside class="project-rail" aria-label="Project navigation">
      <header><div><span class="rail-kicker">WORKSPACE</span><h2>Projects</h2></div><button id="rail-new-project" class="icon-button" type="button" title="创建 Project" aria-label="创建 Project">+</button></header>
      <label class="project-search"><span aria-hidden="true"></span><input id="project-search" type="search" placeholder="搜索 Project" autocomplete="off"></label>
      <div id="project-list" class="project-list" aria-live="polite">
        <div class="rail-project-skeleton"><i></i><span></span></div>
        <div class="rail-project-skeleton"><i></i><span></span></div>
        <div class="rail-project-skeleton"><i></i><span></span></div>
      </div>
      <button id="new-project" class="rail-create" type="button"><span>+</span>New project</button>
    </aside>

    <section class="workspace">
      <header class="workspace-topbar">
        <button id="project-rail-toggle" class="mobile-menu" type="button" aria-label="打开 Project 列表">☰</button>
        <div class="context-mark"><span></span></div>
        <div class="context-copy"><b id="context-project">Loading workspace…</b><small id="context-id">正在连接 Backend API</small></div>
        <span id="context-status" class="context-status neutral"><i></i>Loading</span>
        <div class="topbar-spacer"></div>
        <span class="governance-note">Conversation writes · Board reads</span>
        <button id="refresh" class="refresh-button" type="button" title="刷新当前项目"><span>↻</span>Refresh</button>
      </header>
      <main id="page" class="page" tabindex="-1">
        <div class="page-loading" aria-live="polite"><div class="loading-heading"><span class="skeleton block wide"></span><span class="skeleton block medium"></span></div><div class="loading-grid"><div class="skeleton-card"><span class="skeleton line"></span><span class="skeleton line"></span><span class="skeleton line short"></span></div><div class="skeleton-card"><span class="skeleton line"></span><span class="skeleton line"></span><span class="skeleton line short"></span></div><div class="skeleton-card"><span class="skeleton line"></span><span class="skeleton line"></span><span class="skeleton line short"></span></div></div><span class="sr-only">正在加载 DevWerk</span></div>
      </main>
    </section>
    <button class="rail-backdrop" type="button" aria-label="关闭 Project 列表" onclick="document.querySelector('.app-shell').classList.remove('rail-open')"></button>
  </div>

  <dialog id="project-dialog" class="project-dialog">
    <form id="project-form">
      <header><div><span class="eyebrow">NEW PROJECT</span><h2>创建隔离的 Project</h2><p>Project path 是 Context 与所有生成文件的边界。</p></div><button id="project-dialog-close" class="dialog-close" type="button" aria-label="关闭">×</button></header>
      <label><span>名称</span><input name="name" required maxlength="120" placeholder="例如：我的项目"></label>
      <label><span>说明</span><textarea name="description" rows="3" maxlength="4000" placeholder="这个 Project 的目标和背景"></textarea></label>
      <label><span>Project path</span><input name="base_dir" required placeholder="D:\workspace\my-project"><small>DevWerk 只会在这个目录边界内创建和验证产物。</small></label>
      <footer><button class="button" id="project-dialog-cancel" type="button" onclick="document.getElementById('project-dialog').close()">取消</button><button class="button primary" type="submit">创建 Project</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
